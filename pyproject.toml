[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-distributed-lock-vault"
version = "0.1.0"
description = "Leased mutual exclusion locks and fencing tokens preventing race conditions on shared workspace files"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
swarm-distributed-lock-vault = "swarm_distributed_lock_vault.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["swarm_distributed_lock_vault*"]
